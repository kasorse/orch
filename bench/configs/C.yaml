# C: the orchestrator with its defaults: `run --mode auto`, the LLM decision provider chooses
# the stages (SPEC.md §8). Everything not named in the template below is
# orchestrator.example.yaml unchanged; the fields filled per task are {{.Model}},
# {{.TestCommand}}, {{.RoBinds}}, {{.RwBinds}} and {{.Timeout}}. decision.on_failure is
# `fail` here, not the example's `ask`: ask would wait for a person on stdin, and a benchmark
# has none.
kind: orchestrator
config: |
  version: 2

  decision:
    provider: claude
    model: haiku
    timeout: 60s
    complexity:
      primary: choice
      shadow: true
    on_failure: fail
    jev:
      base_url: https://api.typesafe.ai
      api_key_env: JEV_API_KEY
      max_retries: 1
      mock: false

  translation:
    provider: claude
    model: haiku
    timeout: 60s

  clarify: {enabled: false}

  policy:
    context_depth:
      project_threshold: 0.5
    clarify:
      threshold: 0.80
    complexity:
      cuts: {medium: 1.24, complex: 1.48}
    stages:
      thresholds: {research: 0.81, development: 0.81}
      force:
        medium: [investigation, review]
        complex: [investigation, review]

  context:
    max_files: 20
    max_bytes: 24576
    extra_deny: []

  actions:
    research:
      provider: claude
      model: sonnet
      effort: medium
    investigate:
      provider: claude
      model: sonnet
    implement:
      provider: claude
      model: "{{.Model}}"
    review:
      provider: claude
      model: sonnet
      timeout: 20m

  test:
    command: "{{.TestCommand}}"
    sandbox: bwrap
    ro_binds: {{.RoBinds}}
    rw_binds: {{.RwBinds}}

  limits:
    max_steps: 12
    max_fix_iterations: 2

  execution:
    timeout: "{{.Timeout}}"
    isolation: inplace   # the bench's final check reads the workspace tree
    rate_limit_wait: 0s  # fail at once on a usage limit: orchbench waits for the reset and reruns the cell

  security:
    require_clean_worktree: true
    # The list that was built into the orchestrator before TODO.md S9, written out.
    protected_paths: [".claude/**", ".mcp.json", ".github/workflows/**", ".gitlab-ci.yml", ".envrc", ".vscode/**"]
