# B: the orchestrator as the owner runs it (~/orchestrator_v2.yaml, 2026-10-20): `run --mode
# auto`, the LLM decision provider on opus chooses the stages, by_complexity routes and escalates.
# Left out because they are not about the pipeline or cannot work in a bench workspace: jira and
# providers (the container gets one credential and no gateway), extensions.mcp.graphify (no graph
# in a task's repository), auto_commit (the final check reads the working tree) and
# security.secret_scan.allow_paths (paths of one repository). The fields filled per task are
# {{.Model}}, {{.TestCommand}}, {{.RoBinds}}, {{.RwBinds}} and {{.Timeout}}; implement's base model
# is {{.Model}}, the owner's sonnet.
kind: orchestrator
config: |
  version: 2

  decision:
    provider: claude
    model: opus
    timeout: 30s
    on_failure: fail
    complexity:
      primary: choice
      shadow: true

  translation:
    provider: claude
    model: opus
    timeout: 60s

  policy:
    context_depth:
      project_threshold: 0.5
    complexity:
      cuts: {medium: 1.24, complex: 1.48}
    stages:
      thresholds: {research: 0.81, development: 0.81}
      force:
        medium: [planning, review]
        complex: [planning, review]

  context:
    max_files: 20
    max_bytes: 24576
    extra_deny: []

  actions:
    research:
      provider: claude
      model: haiku
    plan:
      provider: claude
      model: opus
      effort: medium
      timeout: 5m
      by_complexity:
        simple: {model: sonnet, effort: high}
        complex: {model: opus, effort: high}
    implement:
      provider: claude
      model: "{{.Model}}"
      effort: high
      by_complexity:
        simple: {model: sonnet, effort: medium}
        medium: {model: sonnet, effort: high, escalate: {model: opus}}
        complex: {model: sonnet, effort: high, escalate: {model: opus, effort: high}}
      escalate: true
      timeout: 30m
    review:
      provider: claude
      model: opus
      effort: medium
      by_complexity:
        simple: {model: sonnet, effort: high}
        complex: {model: opus, effort: high}
      timeout: 10m

  test:
    command: "{{.TestCommand}}"
    sandbox: bwrap
    ro_binds: {{.RoBinds}}
    rw_binds: {{.RwBinds}}

  limits:
    max_steps: 12
    max_fix_iterations: 2

  execution:
    timeout: "{{.Timeout}}"
    isolation: inplace   # the bench's final check reads the workspace tree
    rate_limit_wait: 0s  # fail at once on a usage limit: orchbench waits for the reset and reruns the cell

  security:
    require_clean_worktree: true
    protected_paths: []
