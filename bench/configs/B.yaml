# B: the orchestrator as a user runs it: `run --mode auto`, the LLM decision provider
# chooses the stages (SPEC.md §8). Everything not named in the template below is
# orchestrator.example.yaml unchanged; the fields filled per task are {{.Model}},
# {{.TestCommand}}, {{.RoBinds}}, {{.RwBinds}} and {{.Timeout}}. decision.on_failure is
# `fail` here, not the example's `ask`: ask would wait for a person on stdin, and a benchmark
# has none.
kind: orchestrator
config: |
  version: 2

  decision:
    provider: claude
    model: haiku
    timeout: 60s
    complexity:
      primary: choice
      shadow: true
    on_failure: fail
    jev:
      base_url: https://api.typesafe.ai
      api_key_env: JEV_API_KEY
      max_retries: 1
      mock: false

  translation:
    provider: claude
    model: haiku
    timeout: 60s

  policy:
    context_depth:
      project_threshold: 0.5
    complexity:
      cuts: {medium: 1.24, complex: 1.48}
    stages:
      thresholds: {research: 0.81, analysis: 0.81, planning: 0.81, development: 0.81, testing: 0.60, review: 0.81}
      force:
        complex: [analysis, planning, review]

  context:
    max_files: 20
    max_bytes: 24576
    extra_deny: []

  actions:
    research:
      provider: claude
      model: sonnet
      effort: medium
    analyze:
      provider: claude
      model: sonnet
    plan:
      provider: claude
      model: sonnet
    implement:
      provider: claude
      model: "{{.Model}}"
    review:
      provider: claude
      model: sonnet
      timeout: 20m

  test:
    command: "{{.TestCommand}}"
    sandbox: bwrap
    ro_binds: {{.RoBinds}}
    rw_binds: {{.RwBinds}}

  limits:
    max_steps: 12
    max_fix_iterations: 2

  execution:
    timeout: "{{.Timeout}}"

  security:
    require_clean_worktree: true
    protected_paths: []
