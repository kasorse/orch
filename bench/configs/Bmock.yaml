# B′: B with the offline keyword heuristic as the decision provider, so the decision costs
# nothing and the stage choice can be compared with B's (SPEC.md §8).
kind: orchestrator
config: |
  version: 2

  decision:
    provider: jev
    model: jev-1.13.0
    timeout: 5s
    complexity:
      primary: choice
      shadow: true
    on_failure: fail
    jev:
      base_url: https://api.typesafe.ai
      api_key_env: JEV_API_KEY
      max_retries: 1
      mock: true

  translation:
    provider: claude
    model: haiku
    timeout: 60s

  policy:
    context_depth:
      project_threshold: 0.5
    complexity:
      cuts: {medium: 1.24, complex: 1.48}
    stages:
      thresholds: {research: 0.81, analysis: 0.81, development: 0.81}
      force:
        medium: [analysis, review]
        complex: [analysis, planning, review]

  context:
    max_files: 20
    max_bytes: 24576
    extra_deny: []

  actions:
    research:
      provider: claude
      model: sonnet
      effort: medium
    analyze:
      provider: claude
      model: sonnet
    plan:
      provider: claude
      model: sonnet
    implement:
      provider: claude
      model: "{{.Model}}"
    review:
      provider: claude
      model: sonnet
      timeout: 20m

  test:
    command: "{{.TestCommand}}"
    sandbox: bwrap
    ro_binds: {{.RoBinds}}
    rw_binds: {{.RwBinds}}

  limits:
    max_steps: 12
    max_fix_iterations: 2

  execution:
    timeout: "{{.Timeout}}"

  security:
    require_clean_worktree: true
    protected_paths: []
