# E: D plus actions.implement.verify (specs/quality/tasks/TASK-QL15-bench-configs.md). The
# implement session gets the orchestrator's run_tests tool, which runs the task's test command in
# the sandbox, so E against D measures what verify adds to the same two stages. No `checks:`: a
# task has one test command and no per-repository check list, and a check that D lacks would
# change more than verify. Everything but implement.verify is D's template.
kind: orchestrator
stages: [development, testing]
config: |
  version: 2

  decision:
    provider: claude
    model: haiku
    timeout: 60s
    complexity:
      primary: choice
      shadow: true
    on_failure: fail
    jev:
      base_url: https://api.typesafe.ai
      api_key_env: JEV_API_KEY
      max_retries: 1
      mock: false

  translation:
    provider: claude
    model: haiku
    timeout: 60s

  policy:
    context_depth:
      project_threshold: 0.5
    complexity:
      cuts: {medium: 1.24, complex: 1.48}
    stages:
      thresholds: {research: 0.81, analysis: 0.81, development: 0.81}
      force:
        medium: [analysis, review]
        complex: [analysis, planning, review]

  context:
    max_files: 20
    max_bytes: 24576
    extra_deny: []

  actions:
    research:
      provider: claude
      model: sonnet
      effort: medium
    analyze:
      provider: claude
      model: sonnet
    plan:
      provider: claude
      model: sonnet
    implement:
      provider: claude
      model: "{{.Model}}"
      verify: true
    review:
      provider: claude
      model: sonnet
      timeout: 20m

  test:
    command: "{{.TestCommand}}"
    sandbox: bwrap
    ro_binds: {{.RoBinds}}
    rw_binds: {{.RwBinds}}

  limits:
    max_steps: 12
    max_fix_iterations: 2

  execution:
    timeout: "{{.Timeout}}"
    isolation: inplace   # the bench's final check reads the workspace tree

  security:
    require_clean_worktree: true
    protected_paths: []
