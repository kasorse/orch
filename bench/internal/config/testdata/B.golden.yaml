version: 2

decision:
  provider: claude
  model: opus
  timeout: 30s
  on_failure: fail
  complexity:
    primary: choice
    shadow: true

translation:
  provider: claude
  model: opus
  timeout: 60s

clarify: {enabled: false}

policy:
  context_depth:
    project_threshold: 0.5
  clarify:
    threshold: 0.80
  complexity:
    cuts: {medium: 1.24, complex: 1.48}
  stages:
    thresholds: {research: 0.81, development: 0.81}
    force:
      medium: [investigation, review]
      complex: [investigation, review]

context:
  max_files: 20
  max_bytes: 24576
  extra_deny: []

actions:
  research:
    provider: claude
    model: haiku
  investigate:
    provider: claude
    model: opus
    effort: medium
    timeout: 5m
    by_complexity:
      simple: {model: sonnet, effort: high}
      complex: {model: opus, effort: high}
  implement:
    provider: claude
    model: "sonnet"
    effort: high
    by_complexity:
      simple: {model: sonnet, effort: medium}
      medium: {model: sonnet, effort: high, escalate: {model: opus}}
      complex: {model: sonnet, effort: high, escalate: {model: opus, effort: high}}
    escalate: true
    timeout: 30m
  review:
    provider: claude
    model: opus
    effort: medium
    by_complexity:
      simple: {model: sonnet, effort: high}
      complex: {model: opus, effort: high}
    timeout: 10m

test:
  command: "go test ./... -run \"TestA|TestB\" && echo 'ok'"
  sandbox: bwrap
  ro_binds: ["~/go/pkg/mod","/opt/my tools"]
  rw_binds: ["~/.cache/go-build","/tmp/a\"b"]

limits:
  max_steps: 12
  max_fix_iterations: 2

execution:
  timeout: "30m0s"
  isolation: inplace   # the bench's final check reads the workspace tree
  rate_limit_wait: 0s  # fail at once on a usage limit: orchbench waits for the reset and reruns the cell

security:
  require_clean_worktree: true
  protected_paths: []
