version: 2

decision:
  provider: claude
  model: haiku
  timeout: 60s
  complexity:
    primary: choice
    shadow: true
  on_failure: fail
  jev:
    base_url: https://api.typesafe.ai
    api_key_env: JEV_API_KEY
    max_retries: 1
    mock: false

translation:
  provider: claude
  model: haiku
  timeout: 60s

policy:
  context_depth:
    project_threshold: 0.5
  complexity:
    complex: 0.40
    medium: 0.50
  stages:
    thresholds: {research: 0.70, analysis: 0.60, planning: 0.65, development: 0.60, testing: 0.60, review: 0.70}
    force:
      complex: [analysis, planning, review]

context:
  max_files: 20
  max_bytes: 24576
  extra_deny: []

actions:
  research:
    provider: claude
    model: sonnet
    effort: medium
  analyze:
    provider: claude
    model: sonnet
  plan:
    provider: claude
    model: sonnet
  implement:
    provider: claude
    model: "sonnet"
  review:
    provider: claude
    model: sonnet
    timeout: 20m

test:
  command: "go test ./... -run \"TestA|TestB\" && echo 'ok'"
  sandbox: bwrap
  ro_binds: ["~/go/pkg/mod","/opt/my tools"]
  rw_binds: ["~/.cache/go-build","/tmp/a\"b"]

limits:
  max_steps: 12
  max_fix_iterations: 2

execution:
  timeout: "30m0s"

security:
  require_clean_worktree: true
  protected_paths: []
