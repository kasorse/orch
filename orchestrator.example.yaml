version: 2

# Who decides the workflow: jev (the Jev HTTP API) or a CLI provider (claude, codex,
# gemini) answering the same questions. The flow is the same either way.
decision:
  provider: jev
  model: jev-1.13.0          # jev: a version, not an alias; CLI provider: its model
  timeout: 5s                # jev: one HTTP request; CLI provider: one call
  complexity:
    primary: choice          # choice | score - the question the policy decides on
    shadow: true             # also ask the other one, for comparison in the trace
  on_failure: ask            # ask: choose complexity and stages by hand; fail: stop
  jev:                       # read only when provider is jev
    base_url: https://api.typesafe.ai
    api_key_env: JEV_API_KEY # the key itself never goes in this file
    max_retries: 1
    mock: false              # true: offline keyword heuristic instead of the API

# A request that is mostly Russian is translated to English before the decision.
translation:
  provider: claude
  model: haiku
  timeout: 60s

policy:
  context_depth:
    project_threshold: 0.5   # P(project) >= threshold -> collect project context
  complexity:
    # size = P(medium) + 2·P(complex), in [0, 2]: size >= complex -> complex, >= medium -> medium,
    # else simple (specs/decision-shape/SPEC.md §5). The cuts are the 50/35/15 quantiles of 43
    # claude/opus decisions on this repository's tasks (2026-10-13); another decision model or
    # task stream answers on another scale, so recalibrate for yours (SPEC.md §7).
    cuts: {medium: 1.24, complex: 1.48}
  stages:
    # 0.81 except testing (MVP.md §9.1): testing stays lower, so a run that implements also
    # tests. The earlier 0.60-0.70 left analysis and review always on, planning by chance.
    thresholds: {research: 0.81, analysis: 0.81, planning: 0.81, development: 0.81, testing: 0.60, review: 0.81}
    force:
      complex: [analysis, planning, review]
  # Path rules (specs/governance/SPEC.md §4): checked on the run's net diff after each implement.
  # Rules apply in file order and every matching rule applies, so requirements add up. A change
  # that matches a rule whose stage the workflow lacks stops the run. To forbid a path outright
  # use security.protected_paths; deny_change is rejected.
  # paths:
  #   - match: "migrations/**"
  #     require_stages: [review, testing]
  #     approval: manual
  #   - match: "**/*.sql"
  #     approval: manual
  # Exploration (specs/governance/SPEC.md §7.4), off by default: a stage the policy left off, not
  # forced, with P within `band` below its threshold is turned on in `rate` of the runs, chosen
  # by the run id. It only turns stages on (so a run costs more, never less checked), records them
  # as `explored`, and gives `decisions calibrate` the data to propose a lower threshold.
  # band is in (0, 0.2], rate in (0, 0.5]. Never used with --stage.
  # explore:
  #   band: 0.05
  #   rate: 0.1

context:
  max_files: 20
  max_bytes: 24576           # the JSON sent to the decision provider
  extra_deny: []             # glob patterns never read, on top of .env*, *.pem, *.key, ...

actions:
  # effort (optional, claude only): low | medium | high | xhigh | max; unset = CLI default.
  research:
    provider: claude
    model: sonnet
    effort: medium

  analyze:
    provider: claude
    model: sonnet

  plan:
    provider: claude
    model: sonnet

  implement:
    provider: claude
    model: opus
    # Optional (implement only): give the session two tools served by the orchestrator itself,
    # run_tests and, with `checks:` below, run_check, so it can run test.command and the
    # checks before it answers. The model chooses only a name and a test filter, never a
    # command; every run is sandboxed and preceded by the protected-paths guard, and a run
    # after the model changed hooks, CI or this config fails the step. Needs test.command,
    # test.sandbox bwrap and provider claude. The final test step stays the source of truth.
    # Each call is recorded in run.json (verify_calls) and its output in
    # logs/<NNN>-implement.verify-<K>.{stdout,stderr}.log. Default false. The calls run inside
    # the implement step, so raise its timeout (this action's `timeout:`, within execution.timeout)
    # when verify is on.
    # verify: true
    # timeout: 30m
    # Optional, default none, on any action: a model and/or effort per decided complexity (simple | medium |
    # complex). A field left out keeps the action's own value above; the provider cannot be
    # changed. A level without an entry, and a run started with --stage, use the action's own
    # model. Each step records where its model came from (model_source in run.json), and
    # decision.json lists the model every action gets. A resume warns when its config would
    # route a remaining step to another model or effort than the run started with.
    # by_complexity:
    #   simple:  {model: haiku, effort: low}
    #   complex: {model: opus, effort: high}

  review:
    provider: claude
    model: sonnet
    # Optional, default [], review only: extra reviewers, up to 4 model names on this provider. After the
    # model above each one reviews the same diff in turn, and the issues are merged (a
    # criterion is met only if every reviewer says so). Each is another call, so it costs.
    # models: [opus]
    # codex and gemini are refused for every action until their permission flags are
    # verified against the real CLI (specs/permissions/SPEC.md §6.4):
    # provider: codex
    # model: gpt
    # Optional per-action timeout override. Review can be the slowest step (it inspects
    # the full git diff), so it's the most likely to need more than its share of
    # execution.timeout below. Still bounded by whatever's left of execution.timeout for
    # the run as a whole - this can only tighten that bound, never extend past it.
    timeout: 20m

test:
  command: "go test ./..."
  # The test command - which executes code the model wrote - runs under bubblewrap:
  # filesystem read-only, repository writable, $HOME hidden, no network (MVP.md §38.3).
  # This is the default and needs bwrap (on Ubuntu 24.04+ also an AppArmor profile for it,
  # see README). Without bwrap (macOS, a host that cannot sandbox) write `sandbox: none`:
  # the tests then reach the network, $HOME and your files, and every run says so.
  sandbox: bwrap
  # Re-expose caches inside the sandbox, e.g. for Go:
  # ro_binds: [~/go/pkg/mod]        # module cache, read-only
  # rw_binds: [~/.cache/go-build]   # build cache, writable
  # The test command inherits only an allowlist of the environment: PATH, HOME, locale,
  # TERM, TZ, TMPDIR, CI and common toolchain variables (GOPATH, GOFLAGS, CARGO_HOME,
  # JAVA_HOME, VIRTUAL_ENV, ...). No proxies, no credentials. Name anything else it needs;
  # a name that looks like a credential (TOKEN, SECRET, PASSWORD, _KEY, _AUTH, ...) is refused.
  # env_pass: [GOPROXY, DATABASE_URL]
  # A workflow that implements and tests runs the tests once before any change and stops if
  # they already fail, so implement is not sent to fix what it did not break. For a task that
  # is about making failing tests pass, start it with `run --allow-red-tests`.
  # baseline: require_green          # require_green (default) | off

# Optional, default none: your own deterministic checks (build, vet, lint, SAST). The test step runs each
# one in order, then test.command, and stops at the first non-zero exit code; the retry
# prompt names the failed check and says the tests did not run. The pre-run test runs the
# same sequence, so a check that already fails stops the run like a failing test
# (`run --allow-red-tests` goes on). Every command runs like test.command: through `sh -c`,
# under the same sandbox, environment and guard. ORCH_BASE_REF is set to the commit the run
# started from (empty if it could not be recorded), so a linter can report only what the run
# introduced. A name matches ^[a-z0-9][a-z0-9_-]{0,31}$ and is unique; at most 16 checks;
# test.command is required. Checks only run when the workflow has a testing stage: to always
# have them, force it with policy.stages.force. Each check's output goes to
# logs/<NNN>-test.<name>.{stdout,stderr}.log in the run directory.
# checks:
#   - {name: build, command: "go build ./..."}
#   - {name: vet,   command: "go vet ./..."}
#   - {name: lint,  command: "golangci-lint run --new-from-rev=$ORCH_BASE_REF"}
#   - {name: sast,  command: "semgrep --error --config p/golang"}

limits:
  max_steps: 12
  max_fix_iterations: 2
  # Stop a fix loop that goes nowhere instead of spending the remaining iterations: implement
  # left the working tree as it was, the same tests fail the same way, or review repeats its
  # blocking issues. The run stops with status stopped and exit code 4, and `resume` goes back
  # into implement. false turns the check off; max_fix_iterations still applies.
  # stop_without_progress: true
  # A budget for the workflow steps: the run stops before its next step once they have cost this
  # much (USD), with status stopped and exit code 4; one expensive step can still overshoot it.
  # Every provider the actions route to must report a call's cost (only claude does), or
  # validation refuses the budget. A call cut short reports no cost, so the sum is then a lower
  # bound. The decision phase (translation, classification) is not counted.
  # max_cost_usd: 5.00
  # Optional bounds on repository data embedded in a prompt; artifacts and logs keep it whole.
  # prompt:
  #   max_test_output_bytes: 32768  # a failing test's output in the implement retry prompt
  #                                 # (beginning, failure lines, end); 4096..1048576
  #   max_diff_bytes: 262144        # the review diff; 16384..4194304
  #   diff_summarize: []            # extra globs shown to review as a stat line only
  # Bounds on actions.implement.verify.
  # verify:
  #   max_calls_per_step: 8         # both tools together, refused calls included; 1..50
  #   call_timeout: 10m             # one run of the test command or a check

execution:
  timeout: 15m

# What steps may do is fixed in code (MVP.md §38): no step has a shell, only implement
# writes, and only inside the repository. These keys only tighten the guards around
# implement; none of them widens what a step may do.
security:
  require_clean_worktree: true   # a workflow with implement refuses a dirty worktree
  protected_paths: []            # extra patterns implement must not change, e.g. [go.mod]
  # Every run checks the provider CLI's version against the range its permission flags were
  # verified on (MVP.md §41.4) and refuses one outside it; true goes on, with a red warning.
  # allow_unverified_cli: false
  # What implement and the test command add is scanned for likely secrets (cloud and service
  # tokens, private keys, JWTs, passwords in URLs, high-entropy assignments). stop (default)
  # ends the run before anything sends the value on; warn records it (file, line, rule - never
  # the value) and redacts it from the review prompt; off does nothing.
  # secret_scan:
  #   mode: stop
  #   allow_paths: [testdata/**]     # fixtures that hold fake keys on purpose

# `orchestrator run --stage <name> [--stage <name> ...] "<task>"` skips the decision section
# above (MVP.md §40); the config must still be valid, but nothing in it is called.

# Optional: your own Claude extensions inside the steps - off unless listed (README,
# "Extensions"). MCP servers keep steps restricted; user_settings loads your plugins, skills
# and hooks (they run your code with your permissions).
# extensions:
#   mcp:
#     graphify:
#       command: graphify-mcp
#       args: ["{repo}/graphify-out/graph.json"]
#       tools: [query_graph, get_node, get_neighbors, shortest_path]
#       actions: [analyze, plan, implement, review]   # default: analyze, plan, review
#   user_settings: true                               # plugins, skills, hooks
#   user_settings_actions: [implement, review]        # default: every model step

# Optional: a review that passes but reports a medium issue sends the run back to implement
# once, as a fix iteration, while max_fix_iterations has room (specs/quality/SPEC.md §7.3).
# The run records the choice when it starts; a resume follows the run, not this file.
# review:
#   fix_medium: true               # default false

# Optional: commit a completed run's changes without asking, also under --mode auto
# (MVP.md §42.6). The same checks as the question; a warning or no summary_short skips it.
# auto_commit: true

# Optional: where `run --jira <KEY|URL>` reads the task from (MVP.md §39). Only run --jira
# needs the credential variables; a plain run and resume work without them.
# jira:
#   base_url: https://yourcompany.atlassian.net   # Data Center: including any context path
#   auth: basic                    # basic: Jira Cloud (email + API token) | bearer: Data Center PAT
#   email_env: JIRA_EMAIL          # basic only: the variable holding the account email
#   token_env: JIRA_API_TOKEN      # the variable holding the API token or PAT - never the token itself
#   timeout: 10s                   # one HTTP attempt
#   max_retries: 1                 # 0-3; 408/429/500/502/503/504 only, honours Retry-After
#   max_bytes: 32768               # cap on the rendered task; a longer ticket is refused, not cut
#   fields:                        # extra text custom fields, rendered in this order when non-empty
#     - id: customfield_10035      # ids: GET <base_url>/rest/api/2/field
#       label: Acceptance criteria
